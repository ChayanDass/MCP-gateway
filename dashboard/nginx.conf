# Static dashboard only. /api and /mcp are routed to the gateway by the Ingress,
# so this container never sees credentials or upstream traffic.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  location /healthz { access_log off; return 200 "ok"; }

  location / {
    try_files $uri /index.html;
  }
}
