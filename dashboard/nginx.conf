# Static dashboard only. /api and /mcp are routed to the gateway by the Ingress,
# so this container never sees credentials or upstream traffic.
server {
  listen 8080;
  root /usr/share/nginx/html;
  index index.html;

  # Compress text responses. The build's file names change with every release,
  # so the hashed assets can be cached for a long time.
  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 512;

  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  location /healthz { access_log off; return 200 "ok"; }

  # Browsers ask for /favicon.ico by default. Serve the real icon, not the
  # single-page fallback.
  location = /favicon.ico {
    try_files /favicon.svg =404;
    default_type image/svg+xml;
    expires 1d;
  }

  # The app shell itself must always be fresh, so each release is picked up.
  location / {
    add_header Cache-Control "no-cache";
    try_files $uri /index.html;
  }
}
