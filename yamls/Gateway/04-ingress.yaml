apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  namespace: gateway
  labels:
    app.kubernetes.io/part-of: mcp-gateway
spec:
  ingressClassName: nginx
  rules:
    - host: localhost
      http:
        paths:
          # Gateway API, MCP endpoint, OAuth sign-in and the metadata MCP clients read.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          # The dashboard page and its static files.
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 8080
    - host: kube-mcp.localtest.me
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /mcp
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /oauth
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /.well-known
            pathType: Prefix
            backend:
              service:
                name: gateway
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: dashboard
                port:
                  number: 8080
