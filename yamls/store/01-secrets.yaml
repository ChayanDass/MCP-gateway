# Replace every CHANGE_ME before applying. Do not commit real values.
# Generate values, for example:
#   openssl rand -base64 24 | tr -d '/+=' | head -c 24
# The WooCommerce consumer key must start with ck_ and the secret with cs_.
apiVersion: v1
kind: Secret
metadata:
  name: store-secrets
  namespace: store
  labels:
    app.kubernetes.io/part-of: woocommerce-store
type: Opaque
stringData:
  mariadb-root-password: CHANGE_ME
  mariadb-password: CHANGE_ME
  wp-admin-password: CHANGE_ME
---
# WooCommerce REST key for the MCP server. The setup Job registers it in
# WooCommerce; the MCP server reads it from this Secret.
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-credentials
  namespace: store
  labels:
    app.kubernetes.io/part-of: woocommerce-store
type: Opaque
stringData:
  consumer-key: ck_CHANGE_ME
  consumer-secret: cs_CHANGE_ME
