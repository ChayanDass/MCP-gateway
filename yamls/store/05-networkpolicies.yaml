# Network policies for the store namespace. Ingress is denied by default; each
# allow rule below opens one path. Enforced by Calico (infra/kind/kind-calico.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: kube-mcp
spec:
  podSelector: {}
  policyTypes: [Ingress]
---
# DNS for the woo-mcp pods, which resolve the wordpress Service name.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-egress
  namespace: kube-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
    # WooCommerce REST API, and nothing else in the store.
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
      ports:
        - port: 80
---
# The woo-mcp server is reached only by the gateway, in its own namespace.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: woo-mcp-from-gateway-only
  namespace: kube-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: woo-mcp
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: gateway
      ports:
        - port: 8080
---
# The store database is reachable only from WordPress and the setup Job.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mariadb-from-store-only
  namespace: kube-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: mariadb
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: wordpress
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: setup
      ports:
        - port: 3306
---
# WordPress is reached by the ingress controller and by the woo-mcp server only.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: wordpress-from-ingress-and-woo-mcp
  namespace: kube-mcp
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-mcp
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: woo-mcp
              app.kubernetes.io/part-of: mcp-gateway
      ports:
        - port: 80
