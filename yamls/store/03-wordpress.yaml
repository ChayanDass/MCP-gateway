# WordPress keeps its core files, plugins and uploads on a PVC, so a restart
# keeps products and media.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-html
  namespace: kube-mcp
  labels:
    app.kubernetes.io/part-of: woocommerce-store
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: standard
  resources:
    requests:
      storage: 5Gi
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: woocommerce-store
spec:
  selector:
    app.kubernetes.io/name: wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  namespace: kube-mcp
  labels:
    app.kubernetes.io/name: wordpress
    app.kubernetes.io/part-of: woocommerce-store
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so replace the pod rather than run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/name: wordpress
        app.kubernetes.io/part-of: woocommerce-store
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: wordpress
          image: wordpress:7.0.4-php8.3-apache
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: store-secrets, key: mariadb-password } }
            # Pin the public URL so links and redirects use the store host.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', 'http://store.localtest.me');
                define('WP_SITEURL', 'http://store.localtest.me');
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $_SERVER['HTTPS'] = 'on'; }
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
          resources:
            requests: { cpu: 250m, memory: 384Mi }
            limits: { cpu: "1", memory: 768Mi }
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: wordpress-html
