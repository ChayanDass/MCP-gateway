# Same as kind.yaml, but without kindnet so Calico can enforce NetworkPolicy.
# Calico is installed separately after the cluster is created.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: kube-mcp
networking:
  disableDefaultCNI: true
  podSubnet: 192.168.0.0/16
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeletExtraArgs:
            node-labels: "ingress-ready=true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80
        protocol: TCP
      - containerPort: 443
        hostPort: 8443
        protocol: TCP
