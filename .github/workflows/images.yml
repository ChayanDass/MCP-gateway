# Builds the three MCP images and pushes them to GitHub Container Registry.
# Runs on every push to main that changes a service, and on demand.
# Images: ghcr.io/<owner>/kube-mcp/{woo-mcp,gateway,dashboard}:<tag>
name: images

on:
  push:
    branches: [main]
    paths:
      - "services/woo-mcp/**"
      - "services/gateway/**"
      - "dashboard/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: woo-mcp
            context: services/woo-mcp
          - name: gateway
            context: services/gateway
          - name: dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image owner and tag
        id: meta
        run: |
          # GHCR needs a lowercase owner, but github.repository_owner keeps its case.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || '0.1.0' }}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # GHCR_TOKEN (optional repo secret, a token with write:packages) is used
          # when the packages were created outside this repo and the built-in token
          # has no write access to them. Otherwise the built-in token is used.
          password: ${{ secrets.GHCR_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kube-mcp/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kube-mcp/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # After the images are built, point the charts at this exact build and commit it.
  # Argo CD sees the new commit and rolls the change out. The commit touches only
  # charts/, so it does not start this workflow again.
  deploy:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Point production values at this build
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          SHA="${{ github.sha }}"
          sed -i -E "s#(wooMcp: ghcr\.io/${OWNER}/kube-mcp/woo-mcp):[^[:space:]]+#\1:${SHA}#" charts/stack/values-prod.yaml
          sed -i -E "s#(gateway: ghcr\.io/${OWNER}/kube-mcp/gateway):[^[:space:]]+#\1:${SHA}#" charts/stack/values-prod.yaml
          sed -i -E "s#(dashboard: ghcr\.io/${OWNER}/kube-mcp/dashboard):[^[:space:]]+#\1:${SHA}#" charts/stack/values-prod.yaml

      - name: Commit and push if the tags changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add charts/stack/values-prod.yaml
          if git diff --cached --quiet; then
            echo "tags already current"
            exit 0
          fi
          git commit -m "Deploy images ${GITHUB_SHA:0:7}"
          git pull --rebase origin main
          git push origin HEAD:main
