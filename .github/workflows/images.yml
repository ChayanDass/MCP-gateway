# Builds the three MCP images and pushes them to GitHub Container Registry.
# Runs on every push to main that changes a service, and on demand.
# Images: ghcr.io/<owner>/kube-mcp/{woo-mcp,gateway,dashboard}:<tag>
name: images

on:
  push:
    branches: [main]
    paths:
      - "services/woo-mcp/**"
      - "services/gateway/**"
      - "dashboard/**"
      - ".github/workflows/images.yml"
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to publish (default: 0.1.0)"
        required: false
        default: "0.1.0"

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: woo-mcp
            context: services/woo-mcp
          - name: gateway
            context: services/gateway
          - name: dashboard
            context: dashboard
    steps:
      - uses: actions/checkout@v4

      - name: Work out the image owner and tag
        id: meta
        run: |
          # GHCR needs a lowercase owner, but github.repository_owner keeps its case.
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "tag=${{ github.event.inputs.tag || '0.1.0' }}" >> "$GITHUB_OUTPUT"
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push ${{ matrix.name }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/kube-mcp/${{ matrix.name }}:${{ steps.meta.outputs.tag }}
            ghcr.io/${{ steps.meta.outputs.owner }}/kube-mcp/${{ matrix.name }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
