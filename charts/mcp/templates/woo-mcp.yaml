# WooCommerce MCP server. ClusterIP only, and the NetworkPolicy admits traffic
# from the gateway alone. It reaches the store over the WordPress REST API.
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mcp.selector" (dict "root" . "component" "woo-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.wooMcp }}
  selector:
    matchLabels:
      {{- include "mcp.selector" (dict "root" . "component" "woo-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp.labels" . | nindent 8 }}
        {{- include "mcp.selector" (dict "root" . "component" "woo-mcp") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: woo-mcp
          image: {{ .Values.images.wooMcp | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # The store's WordPress service, in the same namespace.
            - name: WOO_BASE_URL
              value: http://wordpress/wp-json/wc/v3
            # The store's public home URL. OAuth signatures are computed against it.
            - name: WOO_HOME_URL
              value: {{ .Values.store.siteUrl | quote }}
            # Read from the Secret you create with kubectl (see docs/SETUP.md), never from values.
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.woo.existingSecret | quote }}, key: consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.woo.existingSecret | quote }}, key: consumer-secret } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.wooMcp | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
