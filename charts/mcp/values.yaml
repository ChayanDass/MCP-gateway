# WooCommerce MCP server (woo-mcp) on its own. It calls the store's WordPress
# REST API, which needs a WooCommerce consumer key and secret. Install the store
# first, then create the key in WooCommerce > Settings > Advanced > REST API
# (user admin, Read/Write) and pass both values at install. The gateway chart
# is separate and installs after this one.

imagePullPolicy: IfNotPresent

images:
  wooMcp: ghcr.io/chayandass/kube-mcp/woo-mcp:6b7bb68ea014a490c15b4870dffbc5f379a1e101

replicas:
  wooMcp: 1

store:
  siteUrl: http://store.localtest.me

# WooCommerce REST key, stored in a Secret created outside Helm:
#   kubectl -n kube-mcp create secret generic woo-mcp-credentials \
#     --from-literal=consumer-key='ck_...' --from-literal=consumer-secret='cs_...'
woo:
  existingSecret: woo-mcp-credentials

resources:
  wooMcp:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 250m, memory: 128Mi }
