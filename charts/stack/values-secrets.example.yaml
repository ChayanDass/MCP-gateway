# Copy to values-secrets.yaml (git-ignored) and fill in.
#   cp charts/stack/values-secrets.example.yaml charts/stack/values-secrets.yaml
mcp:
  woo:
    # WooCommerce > Settings > Advanced > REST API > Add key (user admin, Read/Write)
    consumerKey: "ck_REPLACE_ME"
    consumerSecret: "cs_REPLACE_ME"
gateway:
  auth:
    # OAuth client ID from Google Cloud Console (not secret, but kept out of the repo)
    googleClientId: "REPLACE_ME.apps.googleusercontent.com"
