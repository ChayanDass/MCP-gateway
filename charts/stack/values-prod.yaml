# Production: AWS k3s cluster (see infra/aws/k3s). HTTPS only.
# Hostnames: nip.io names that point at the server's IP. Replace with your domain later.
# Each hostname gets a Let's Encrypt certificate (cert-manager, ClusterIssuer letsencrypt-prod).
# The bare IP gets a self-signed certificate (secret kube-mcp/ip-tls), so browsers warn for it.
# Use: helm install kube-mcp charts/stack -f charts/stack/values-prod.yaml

ingress-nginx:
  controller:
    admissionWebhooks:
      # Off: the validating webhook's certificate kept failing on this cluster.
      enabled: false
    extraArgs:
      default-ssl-certificate: "kube-mcp/ip-tls"

store:
  siteUrl: https://store.13.200.126.173.nip.io
  storeTitle: "Harbor & Hearth"
  secrets:
    # Created by scripts/bootstrap.sh, not by Helm or git.
    create: false
  storage:
    className: local-path
  # Small nodes: the setup Job's memory request is kept low.
  resources:
    setup:
      requests: { cpu: 50m, memory: 64Mi }
      limits: { cpu: 500m, memory: 512Mi }

gateway:
  publicBaseUrl: https://kube-mcp.13.200.126.173.nip.io
  imagePullPolicy: IfNotPresent
  replicas:
    gateway: 2
  databasePoolMax: 10
  images:
    gateway: ghcr.io/chayandass/kube-mcp/gateway:bdb66150035352c9608b1d8be9095d21f828047d
    dashboard: ghcr.io/chayandass/kube-mcp/dashboard:bdb66150035352c9608b1d8be9095d21f828047d
  # Google OAuth client ID. Public (it appears in the sign-in page), so it can live in git.
  auth:
    googleClientId: "763488963092-29kda33fj5n268ftf8sf2fe1k0ce03rm.apps.googleusercontent.com"
  secrets:
    create: false
  storage:
    className: local-path

mcp:
  imagePullPolicy: IfNotPresent
  images:
    wooMcp: ghcr.io/chayandass/kube-mcp/woo-mcp:bdb66150035352c9608b1d8be9095d21f828047d
  store:
    # woo-mcp signs its requests with this address. It calls WordPress over plain HTTP
    # inside the cluster, and WooCommerce checks the signature against the scheme it sees,
    # so this must be http:// even though the public site is https://.
    siteUrl: http://store.13.200.126.173.nip.io

ingress:
  ingress:
    annotations:
      gitops-check: "argo-autosync-test-1"
    store:
      host: store.13.200.126.173.nip.io
    dashboard:
      hosts: [kube-mcp.13.200.126.173.nip.io]
    tls:
      enabled: true
      clusterIssuer: letsencrypt-prod
      ipRule: true
