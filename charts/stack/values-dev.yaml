# Development: local Kind cluster. Plain HTTP, *.localtest.me names (resolve to 127.0.0.1).
# Use: helm install kube-mcp charts/stack -f charts/stack/values-dev.yaml

ingress-nginx:
  controller:
    admissionWebhooks:
      enabled: false

store:
  siteUrl: http://store.localtest.me
  storage:
    className: standard

gateway:
  publicBaseUrl: http://localhost
  auth:
    # Public Google OAuth client ID. Keep this aligned with the authorized localhost origin.
    googleClientId: "763488963092-29kda33fj5n268ftf8sf2fe1k0ce03rm.apps.googleusercontent.com"
  storage:
    className: standard

mcp:
  store:
    siteUrl: http://store.localtest.me

ingress:
  ingress:
    store:
      host: store.localtest.me
    dashboard:
      hosts: [localhost, kube-mcp.localtest.me]
    tls:
      enabled: false
      clusterIssuer: ""
      ipRule: false
