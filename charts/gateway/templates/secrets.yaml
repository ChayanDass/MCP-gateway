{{- if .Values.secrets.create }}
# Generated credentials for the MCP stack. Values are generated once and kept
# across upgrades with lookup, so a helm upgrade never rotates the database
# password out from under a running Postgres.
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $prev := dict }}
{{- if $existing }}{{ $prev = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
type: Opaque
data:
  postgres-password: {{ dig "postgres-password" "" $prev | default (randAlphaNum 32 | b64enc) | quote }}
  # 32 ASCII bytes, base64-encoded again: the gateway decodes it to a 32-byte AES key.
  gateway-encryption-key: {{ dig "gateway-encryption-key" "" $prev | default (randAlphaNum 32 | b64enc | b64enc) | quote }}
  bootstrap-admin-password: {{ dig "bootstrap-admin-password" "" $prev | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}
