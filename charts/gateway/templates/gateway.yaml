apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    {{- include "mcp.selector" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "mcp.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
{{- if .Values.monitoring.serviceMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.serviceMonitor.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      {{- include "mcp.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.monitoring.serviceMonitor.interval | quote }}
{{- end }}
---
{{- if .Values.monitoring.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
    {{- with .Values.monitoring.prometheusRule.additionalLabels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  groups:
    - name: kube-mcp.gateway
      rules:
        - alert: KubeMcpGatewayReplicasUnavailable
          expr: kube_deployment_status_replicas_available{namespace={{ .Release.Namespace | quote }},deployment="gateway"} < kube_deployment_spec_replicas{namespace={{ .Release.Namespace | quote }},deployment="gateway"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Gateway replicas are unavailable
            description: One or more desired gateway replicas have been unavailable for five minutes.
        - alert: KubeMcpGatewayHighHttp5xxRate
          expr: (sum(rate(kmcp_http_requests_total{namespace={{ .Release.Namespace | quote }},status="5xx"}[5m])) / clamp_min(sum(rate(kmcp_http_requests_total{namespace={{ .Release.Namespace | quote }}}[5m])), 0.001) > 0.05) and (sum(rate(kmcp_http_requests_total{namespace={{ .Release.Namespace | quote }}}[5m])) > 0.1)
          for: 10m
          labels:
            severity: warning
          annotations:
            summary: Gateway HTTP error rate is elevated
            description: More than five percent of gateway HTTP responses are 5xx for ten minutes.
        - alert: KubeMcpGatewayMetricsCollectionFailed
          expr: kmcp_metrics_upstream_status_collection_error{namespace={{ .Release.Namespace | quote }}} > 0
          for: 2m
          labels:
            severity: warning
          annotations:
            summary: Gateway cannot collect upstream status metrics
            description: Check gateway database connectivity and gateway logs.
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.gateway }}
  selector:
    matchLabels:
      {{- include "mcp.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mcp.labels" . | nindent 8 }}
        {{- include "mcp.selector" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              {{- include "mcp.selector" (dict "root" . "component" "gateway") | nindent 14 }}
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: {{ .Values.images.gateway | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Must come before DATABASE_URL: Kubernetes expands $(VAR) only from earlier entries.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: postgres-password } }
            - name: DATABASE_URL
              value: postgres://gateway:$(POSTGRES_PASSWORD)@postgres:5432/gateway
            - name: DATABASE_POOL_MAX
              value: {{ .Values.databasePoolMax | quote }}
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: gateway-encryption-key } }
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrapAdminEmail | quote }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: bootstrap-admin-password } }
            - name: WOO_MCP_URL
              value: http://woo-mcp:8080/mcp
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.auth.googleClientId | quote }}
            - name: GOOGLE_ALLOWED_DOMAINS
              value: {{ .Values.auth.googleAllowedDomains | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            - name: UPSTREAM_HOST_ALLOWLIST
              value: {{ join "," .Values.upstreamHostAllowlist | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources.gateway | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
