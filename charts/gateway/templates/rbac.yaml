# The gateway creates and deletes store namespaces, so it needs a service account with
# Kubernetes permissions. This is the broadest permission in the stack. The ClusterRole
# is limited to the resource kinds the provisioner uses. Narrowing it further means
# binding per-namespace Roles, which needs a separate provisioner component.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: gateway
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ .Release.Namespace }}-store-provisioner
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, list, create, patch, delete]
  - apiGroups: [""]
    resources: [secrets, configmaps, services, persistentvolumeclaims, resourcequotas, limitranges]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: ["apps"]
    resources: [deployments, statefulsets]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: ["batch"]
    resources: [jobs]
    verbs: [get, list, create, patch, update, delete]
  - apiGroups: ["networking.k8s.io"]
    resources: [networkpolicies, ingresses]
    verbs: [get, list, create, patch, update, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ .Release.Namespace }}-store-provisioner-gateway
  labels:
    {{- include "mcp.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ .Release.Namespace }}-store-provisioner
subjects:
  - kind: ServiceAccount
    name: gateway
    namespace: {{ .Release.Namespace }}
