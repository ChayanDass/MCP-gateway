# Gateway stack: the MCP gateway, its dashboard and the gateway's Postgres.
# It reaches the WooCommerce MCP server (woo-mcp, the mcp chart) by its
# in-cluster name. Install the mcp chart first. Environment values go in
# --set or a values file kept out of the repo.

imagePullPolicy: IfNotPresent

images:
  postgres: postgres:16-alpine
  gateway: ghcr.io/chayandass/kube-mcp/gateway:373653d82da4015edf7082c9aa7d509b07b53ada
  dashboard: ghcr.io/chayandass/kube-mcp/dashboard:373653d82da4015edf7082c9aa7d509b07b53ada

replicas:
  gateway: 1
  dashboard: 1

storage:
  className: standard
  postgresSize: 2Gi

# Secrets generated by this chart (see templates/secrets.yaml).
secrets:
  name: gateway-secrets
  # false: the Secret is created outside Helm (scripts/bootstrap.sh), e.g. for GitOps.
  create: true

ingress:
  className: nginx
  controllerNamespace: ingress-nginx
  # localhost is needed for Google sign-in, which accepts plain HTTP only on localhost.
  dashboardHosts: [localhost, kube-mcp.localtest.me]

publicBaseUrl: http://kube-mcp.localtest.me
bootstrapAdminEmail: admin@example.com

# Hostnames the gateway may reach even under a denied pattern.
upstreamHostAllowlist: []

# Addresses the gateway may reach on the Kubernetes API port (443/6443): the cluster service
# IP and the control-plane node address. Set per cluster (the local kind values use these).
kubeApiCidrs: [10.96.0.1/32, 172.19.0.2/32]

# Google sign-in for the dashboard. Pass the client ID at install time with
# --set-string auth.googleClientId=... so it stays out of the repo.
auth:
  googleClientId: ""
  googleAllowedDomains: ""

resources:
  postgres:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  gateway:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  dashboard:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
