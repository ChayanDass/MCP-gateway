# Gateway stack: the MCP gateway, its dashboard and the gateway's Postgres.
# It reaches the WooCommerce MCP server (woo-mcp, the mcp chart) by its
# in-cluster name. Install the mcp chart first. Environment values go in
# --set or a values file kept out of the repo.

imagePullPolicy: IfNotPresent

images:
  postgres: postgres:16-alpine
  gateway: ghcr.io/chayandass/kube-mcp/gateway:6b7bb68ea014a490c15b4870dffbc5f379a1e101
  dashboard: ghcr.io/chayandass/kube-mcp/dashboard:6b7bb68ea014a490c15b4870dffbc5f379a1e101

replicas:
  gateway: 1
  dashboard: 1

# Maximum PostgreSQL connections per gateway pod. Budget total connections as
# gateway replicas * databasePoolMax, plus administration and other clients.
databasePoolMax: 10

# Requires Prometheus Operator. The gateway metrics endpoint stays cluster-internal.
monitoring:
  serviceMonitor:
    enabled: false
    interval: 30s
    additionalLabels: {}
  prometheusRule:
    enabled: false
    additionalLabels: {}

storage:
  className: standard
  postgresSize: 2Gi

# Secrets generated by this chart (see templates/secrets.yaml).
secrets:
  name: gateway-secrets
  # false: the Secret is created outside Helm (scripts/bootstrap.sh), e.g. for GitOps.
  create: true

ingress:
  className: nginx
  controllerNamespace: ingress-nginx
  # localhost is needed for Google sign-in, which accepts plain HTTP only on localhost.
  dashboardHosts: [localhost, kube-mcp.localtest.me]

publicBaseUrl: http://kube-mcp.localtest.me
bootstrapAdminEmail: admin@example.com

# Hostnames the gateway may reach even under a denied pattern.
upstreamHostAllowlist: []

# Google sign-in for the dashboard. The stack supplies this public client ID
# from values-dev.yaml or values-prod.yaml.
auth:
  googleClientId: ""
  googleAllowedDomains: ""

resources:
  postgres:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 500m, memory: 256Mi }
  gateway:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 500m, memory: 256Mi }
  dashboard:
    requests: { cpu: 10m, memory: 16Mi }
    limits: { cpu: 100m, memory: 64Mi }
