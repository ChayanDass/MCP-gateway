{{- /*
  One Secret holds every generated credential. Values are generated once and
  then kept across upgrades with `lookup`, so a `helm upgrade` never rotates
  a database password out from under a running database.
  Set secrets.create=false and provide secrets.name yourself to manage them
  out of band (e.g. sealed-secrets or External Secrets).
*/ -}}
{{- if .Values.secrets.create }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $prev := dict }}
{{- if $existing }}{{ $prev = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "kube-mcp.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ (get $prev "mariadb-root-password") | default (randAlphaNum 32 | b64enc) | quote }}
  mariadb-password: {{ (get $prev "mariadb-password") | default (randAlphaNum 32 | b64enc) | quote }}
  wp-admin-password: {{ (get $prev "wp-admin-password") | default (randAlphaNum 24 | b64enc) | quote }}
  woo-consumer-key: {{ (get $prev "woo-consumer-key") | default (printf "ck_%s" (randAlphaNum 40) | b64enc) | quote }}
  woo-consumer-secret: {{ (get $prev "woo-consumer-secret") | default (printf "cs_%s" (randAlphaNum 40) | b64enc) | quote }}
  postgres-password: {{ (get $prev "postgres-password") | default (randAlphaNum 32 | b64enc) | quote }}
  # 32 ASCII bytes, base64-encoded again: the gateway decodes it to a 32-byte AES key.
  gateway-encryption-key: {{ (get $prev "gateway-encryption-key") | default (randAlphaNum 32 | b64enc | b64enc) | quote }}
  bootstrap-admin-password: {{ (get $prev "bootstrap-admin-password") | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}
