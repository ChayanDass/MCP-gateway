apiVersion: v1
kind: Service
metadata:
  name: gateway
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  selector:
    {{- include "kube-mcp.selector" (dict "root" . "component" "gateway") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "gateway") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.gateway }}
  selector:
    matchLabels:
      {{- include "kube-mcp.selector" (dict "root" . "component" "gateway") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-mcp.componentLabels" (dict "root" . "component" "gateway") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: gateway
          image: {{ .Values.images.gateway | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            # Must come before DATABASE_URL: Kubernetes expands $(VAR) only from earlier entries.
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: postgres-password } }
            - name: DATABASE_URL
              value: postgres://gateway:$(POSTGRES_PASSWORD)@postgres:5432/gateway
            - name: ENCRYPTION_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: gateway-encryption-key } }
            - name: BOOTSTRAP_ADMIN_EMAIL
              value: {{ .Values.bootstrapAdminEmail | quote }}
            - name: BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: bootstrap-admin-password } }
            - name: WOO_MCP_URL
              value: http://woo-mcp:8080/mcp
            # GitHub OAuth App for per-member connections. Created out of band:
            #   kubectl create secret generic github-oauth -n kube-mcp \
            #     --from-literal=client-id=... --from-literal=client-secret=...
            - name: GITHUB_OAUTH_CLIENT_ID
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-id
                  optional: true
            - name: GITHUB_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: github-oauth
                  key: client-secret
                  optional: true
            - name: GOOGLE_CLIENT_ID
              value: {{ .Values.auth.googleClientId | quote }}
            - name: GOOGLE_ALLOWED_DOMAINS
              value: {{ .Values.auth.googleAllowedDomains | quote }}
            - name: PUBLIC_BASE_URL
              value: {{ .Values.publicBaseUrl | quote }}
            - name: UPSTREAM_HOST_ALLOWLIST
              value: {{ join "," .Values.upstreamHostAllowlist | quote }}
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 15
            periodSeconds: 20
          {{- include "kube-mcp.resources" .Values.resources.gateway | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
