# WooCommerce MCP server. ClusterIP only, and the NetworkPolicy admits traffic
# from the gateway alone, so it is not reachable from outside the cluster.
apiVersion: v1
kind: Service
metadata:
  name: woo-mcp
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "woo-mcp") | nindent 4 }}
spec:
  selector:
    {{- include "kube-mcp.selector" (dict "root" . "component" "woo-mcp") | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: woo-mcp
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "woo-mcp") | nindent 4 }}
spec:
  replicas: {{ .Values.replicas.wooMcp }}
  selector:
    matchLabels:
      {{- include "kube-mcp.selector" (dict "root" . "component" "woo-mcp") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-mcp.componentLabels" (dict "root" . "component" "woo-mcp") | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: woo-mcp
          image: {{ .Values.images.wooMcp | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: WOO_BASE_URL
              value: http://wordpress/wp-json/wc/v3
            # The store's public home URL. OAuth signatures are computed against it.
            - name: WOO_HOME_URL
              value: {{ .Values.siteUrl | quote }}
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: woo-consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: woo-consumer-secret } }
          readinessProbe:
            httpGet: { path: /readyz, port: http }
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- include "kube-mcp.resources" .Values.resources.wooMcp | nindent 10 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
