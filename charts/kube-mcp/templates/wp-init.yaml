# Post-install/upgrade Job: installs WordPress, WooCommerce, COD payments and a
# WooCommerce REST API key whose secret comes from the Secret, so woo-mcp and
# the store always agree on credentials. Idempotent: re-running it on upgrade
# changes nothing that already exists.
apiVersion: v1
kind: ConfigMap
metadata:
  name: wp-init-script
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wp-init") | nindent 4 }}
data:
  init.sh: |
    #!/bin/sh
    set -eu
    cd /var/www/html
    echo "waiting for WordPress to write wp-config.php"
    i=0
    until [ -f wp-config.php ]; do
      i=$((i+1)); [ "$i" -gt 120 ] && { echo "timed out waiting for wp-config.php"; exit 1; }
      sleep 5
    done

    if ! wp core is-installed  2>/dev/null; then
      wp core install  --url="$SITE_URL" --title="{{ .Values.storeTitle }}" \
        --admin_user=admin --admin_password="$WP_ADMIN_PASSWORD" \
        --admin_email="{{ .Values.storeAdminEmail }}" --skip-email
    fi
    wp rewrite structure '/%postname%/' --hard 

    wp plugin is-installed woocommerce  2>/dev/null || wp plugin install woocommerce --activate 
    wp plugin activate woocommerce 

    # Skip the onboarding wizard and set a test-friendly store.
    wp option update woocommerce_onboarding_profile '{"skipped":true}' --format=json 
    wp option update woocommerce_currency USD 
    wp option update woocommerce_default_country US:CA 
    wp option update woocommerce_cod_settings '{"enabled":"yes","title":"Cash on delivery","description":"Demo payment method."}' --format=json 

    # A flat-rate method on the default zone so checkout can complete.
    wp eval '
      if (class_exists("WC_Shipping_Zones")) {
        $zone = new WC_Shipping_Zone(0);
        $has = false;
        foreach ($zone->get_shipping_methods() as $m) { if ($m->id === "flat_rate") { $has = true; } }
        if (!$has) { $zone->add_shipping_method("flat_rate"); $zone->save(); }
      }' 

    # WooCommerce REST API key. Only a hash of the consumer key is stored,
    # mirroring WooCommerce's own storage format. The secret is the Secret value.
    wp eval '
      global $wpdb;
      $ck = getenv("WOO_CONSUMER_KEY");
      $cs = getenv("WOO_CONSUMER_SECRET");
      $table = $wpdb->prefix . "woocommerce_api_keys";
      $hash = hash_hmac("sha256", $ck, "wc-api");
      $exists = $wpdb->get_var($wpdb->prepare("SELECT key_id FROM $table WHERE consumer_key = %s", $hash));
      if (!$exists) {
        $wpdb->insert($table, array(
          "user_id" => 1,
          "description" => "kube-mcp woo-mcp",
          "permissions" => "read_write",
          "consumer_key" => $hash,
          "consumer_secret" => $cs,
          "truncated_key" => substr($ck, -7),
        ));
      }' 
    echo "WooCommerce ready"
---
apiVersion: batch/v1
kind: Job
metadata:
  name: wp-init
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "5"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wp-init") | nindent 4 }}
spec:
  backoffLimit: 6
  template:
    metadata:
      labels:
        {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wp-init") | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      securityContext:
        fsGroup: 33
      containers:
        - name: wp-cli
          image: {{ .Values.images.wpCli | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "/scripts/init.sh"]
          # Run as www-data so writes into wp-content match the files WordPress created.
          securityContext:
            runAsUser: 33
            runAsGroup: 33
          env:
            - name: SITE_URL
              value: {{ .Values.siteUrl | quote }}
            - name: WP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: wp-admin-password } }
            - name: WOO_CONSUMER_KEY
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: woo-consumer-key } }
            - name: WOO_CONSUMER_SECRET
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: woo-consumer-secret } }
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: mariadb-password } }
          {{- include "kube-mcp.resources" .Values.resources.wpInit | nindent 10 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
            - name: script
              mountPath: /scripts
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: wordpress-html
        - name: script
          configMap:
            name: wp-init-script
            defaultMode: 0755
