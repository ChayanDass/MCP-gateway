# WordPress keeps its core files and wp-content (plugins, uploads) on a PVC, so
# a pod restart or upgrade keeps products and media.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wordpress-html
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wordpress") | nindent 4 }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.storage.className | quote }}
  resources:
    requests:
      storage: {{ .Values.storage.wordpressSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: wordpress
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wordpress") | nindent 4 }}
spec:
  selector:
    {{- include "kube-mcp.selector" (dict "root" . "component" "wordpress") | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wordpress
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wordpress") | nindent 4 }}
spec:
  replicas: 1
  # The PVC is ReadWriteOnce, so replace the pod rather than run two at once.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kube-mcp.selector" (dict "root" . "component" "wordpress") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-mcp.componentLabels" (dict "root" . "component" "wordpress") | nindent 8 }}
    spec:
      securityContext:
        fsGroup: 33
      containers:
        - name: wordpress
          image: {{ .Values.images.wordpress | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: mariadb:3306
            - name: WORDPRESS_DB_NAME
              value: wordpress
            - name: WORDPRESS_DB_USER
              value: wordpress
            - name: WORDPRESS_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: mariadb-password } }
            # Pin the public URL so links and redirects use the storefront host,
            # not whatever Host header an internal caller (woo-mcp) sends.
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ .Values.siteUrl }}');
                define('WP_SITEURL', '{{ .Values.siteUrl }}');
                if (isset($_SERVER['HTTP_X_FORWARDED_PROTO']) && $_SERVER['HTTP_X_FORWARDED_PROTO'] === 'https') { $_SERVER['HTTPS'] = 'on'; }
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 90
            periodSeconds: 20
            failureThreshold: 5
          {{- include "kube-mcp.resources" .Values.resources.wordpress | nindent 10 }}
          volumeMounts:
            - name: html
              mountPath: /var/www/html
      volumes:
        - name: html
          persistentVolumeClaim:
            claimName: wordpress-html
