# Two stable hosts. The dashboard host routes /api and /mcp to the gateway and
# everything else to the static dashboard. The store host goes to WordPress.
{{- $tls := .Values.ingress.tls }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-mcp-dashboard
  labels:
    {{- include "kube-mcp.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.dashboardHost | quote }}]
      secretName: {{ $tls.dashboardSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.dashboardHost | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /mcp
            pathType: Exact
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /healthz
            pathType: Exact
            backend: { service: { name: gateway, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: dashboard, port: { name: http } } }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kube-mcp-store
  labels:
    {{- include "kube-mcp.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if $tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.storeHost | quote }}]
      secretName: {{ $tls.storeSecret }}
  {{- end }}
  rules:
    - host: {{ .Values.ingress.storeHost | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: wordpress, port: { name: http } } }
