# Gateway state: users, hashed API keys, sessions, server registry, audit log.
apiVersion: v1
kind: Service
metadata:
  name: postgres
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  selector:
    {{- include "kube-mcp.selector" (dict "root" . "component" "postgres") | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  labels:
    {{- include "kube-mcp.componentLabels" (dict "root" . "component" "postgres") | nindent 4 }}
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      {{- include "kube-mcp.selector" (dict "root" . "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kube-mcp.componentLabels" (dict "root" . "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: {{ .Values.images.postgres | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: gateway
            - name: POSTGRES_USER
              value: gateway
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: postgres-password } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          readinessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway"] }
            periodSeconds: 5
          livenessProbe:
            exec: { command: ["pg_isready", "-U", "gateway", "-d", "gateway"] }
            initialDelaySeconds: 30
            periodSeconds: 20
          {{- include "kube-mcp.resources" .Values.resources.postgres | nindent 10 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.postgresSize }}
