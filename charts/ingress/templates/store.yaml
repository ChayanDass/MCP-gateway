# Sends the store host to WordPress.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: store
  labels:
    app.kubernetes.io/part-of: kube-mcp
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.ingress.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Values.ingress.store.service }}
                port:
                  name: http
