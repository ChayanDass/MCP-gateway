# Dashboard hosts. The gateway API, MCP and OAuth paths go to the gateway;
# everything else goes to the dashboard.
{{- $tls := .Values.ingress.tls }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: mcp-dashboard
  labels:
    app.kubernetes.io/part-of: kube-mcp
  {{- if $tls.clusterIssuer }}
  annotations:
    cert-manager.io/cluster-issuer: {{ $tls.clusterIssuer | quote }}
  {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  {{- if $tls.enabled }}
  tls:
    - hosts: {{ toJson .Values.ingress.dashboard.hosts }}
      secretName: dashboard-tls
  {{- end }}
  rules:
    {{- range .Values.ingress.dashboard.hosts }}
    - host: {{ . | quote }}
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend: { service: { name: {{ $.Values.ingress.dashboard.gatewayService }}, port: { name: http } } }
          - path: /mcp
            pathType: Exact
            backend: { service: { name: {{ $.Values.ingress.dashboard.gatewayService }}, port: { name: http } } }
          - path: /healthz
            pathType: Exact
            backend: { service: { name: {{ $.Values.ingress.dashboard.gatewayService }}, port: { name: http } } }
          # OAuth sign-in for MCP clients and the metadata they read first.
          - path: /oauth
            pathType: Prefix
            backend: { service: { name: {{ $.Values.ingress.dashboard.gatewayService }}, port: { name: http } } }
          - path: /.well-known
            pathType: Prefix
            backend: { service: { name: {{ $.Values.ingress.dashboard.gatewayService }}, port: { name: http } } }
          - path: /
            pathType: Prefix
            backend: { service: { name: {{ $.Values.ingress.dashboard.dashboardService }}, port: { name: http } } }
    {{- end }}
