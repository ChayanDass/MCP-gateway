{{- if .Values.secrets.create }}
# Generated passwords. On upgrade the existing values are reused, so the
# database and admin accounts keep working.
{{- $existing := lookup "v1" "Secret" .Release.Namespace .Values.secrets.name }}
{{- $prev := dict }}
{{- if $existing }}{{ $prev = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.secrets.name }}
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  mariadb-root-password: {{ dig "mariadb-root-password" "" $prev | default (randAlphaNum 24 | b64enc) | quote }}
  mariadb-password: {{ dig "mariadb-password" "" $prev | default (randAlphaNum 24 | b64enc) | quote }}
  wp-admin-password: {{ dig "wp-admin-password" "" $prev | default (randAlphaNum 24 | b64enc) | quote }}
{{- end }}
