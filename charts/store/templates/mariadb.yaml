# MariaDB holds the WordPress and WooCommerce data. It is reachable only from
# inside the cluster, through the mariadb Service.
apiVersion: v1
kind: Service
metadata:
  name: mariadb
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 4 }}
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mariadb
  labels:
    {{- include "store.labels" . | nindent 4 }}
spec:
  serviceName: mariadb
  replicas: 1
  selector:
    matchLabels:
      {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "store.labels" . | nindent 8 }}
        {{- include "store.selector" (dict "root" . "component" "mariadb") | nindent 8 }}
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.images.mariadb | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: mariadb-root-password } }
            - name: MARIADB_DATABASE
              value: wordpress
            - name: MARIADB_USER
              value: wordpress
            - name: MARIADB_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.secrets.name }}, key: mariadb-password } }
          args: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
          readinessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "mariadb-admin ping -h127.0.0.1 -uroot -p\"$MARIADB_ROOT_PASSWORD\" --silent"]
            initialDelaySeconds: 60
            periodSeconds: 15
          resources:
            {{- toYaml .Values.resources.mariadb | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: {{ .Values.storage.className | quote }}
        resources:
          requests:
            storage: {{ .Values.storage.mariadbSize }}
