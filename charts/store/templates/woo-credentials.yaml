{{- if .Values.secrets.create }}
# WooCommerce REST key for the MCP server. Generated once and kept on upgrades.
# The setup Job registers it in WooCommerce; the mcp chart reads it from here.
{{- $existing := lookup "v1" "Secret" .Release.Namespace "woo-mcp-credentials" }}
{{- $prev := dict }}
{{- if $existing }}{{ $prev = $existing.data }}{{ end }}
apiVersion: v1
kind: Secret
metadata:
  name: woo-mcp-credentials
  labels:
    {{- include "store.labels" . | nindent 4 }}
type: Opaque
data:
  consumer-key: {{ dig "consumer-key" "" $prev | default (printf "ck_%s" (randAlphaNum 40) | b64enc) | quote }}
  consumer-secret: {{ dig "consumer-secret" "" $prev | default (printf "cs_%s" (randAlphaNum 40) | b64enc) | quote }}
{{- end }}
